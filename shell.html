    <title>RayGPU Example</title>
    <style>
      :root {
            --bg-color: #0f172a;
            --text-primary: #f8fafc;
            --accent: #38bdf8;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      /* Header updates */
      header {
        width: 100%;
        padding: 1rem 1.5rem;
        background: #1e293b;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        margin-bottom: 2rem;
      }

      .header-left {
        display: flex;
        align-items: center;
      }

      .header-right {
        display: flex;
        gap: 1rem;
        font-size: 0.9rem;
        font-weight: 500;
      }

      .nav-link {
        color: var(--text-secondary);
        text-decoration: none;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
      }

      .nav-link:hover {
        color: var(--text-primary);
        background-color: rgba(255, 255, 255, 0.05);
      }
      
      .nav-link svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }
      
      a.back-link {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        transition: background-color 0.2s;
      }
      a.back-link:hover {
        background-color: rgba(56, 189, 248, 0.1);
      }
      
      /* Canvas container */
      .canvas-container {
        display: flex;
        justify-content: center;
        margin-bottom: 2rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #334155;
        background: #000;
      }
      
      canvas.emscripten { 
        border: 0px none; 
        background-color: black; 
        display: block;
        outline: none;
      }
      
      /* Console output */
      #output-container, #code-container {
        width: 90%;
        max-width: 900px;
        margin-bottom: 2rem;
      }
      
      .output-label {
        font-size: 0.875rem;
        color: #94a3b8;
        margin-bottom: 0.5rem;
        display: block;
      }

      #output {
        width: 100%;
        height: 150px;
        box-sizing: border-box;
        background-color: #1e293b;
        color: #22d3ee;
        font-family: 'Consolas', 'Monaco', monospace;
        padding: 1rem;
        border-radius: 6px;
        border: 1px solid #334155;
        overflow-y: scroll;
        resize: vertical;
        font-size: 0.9rem;
      }

      /* Source code container improvements */
      #code-container pre {
        background-color: #1e293b !important; /* Override Prism default if needed */
        border-radius: 6px;
        border: 1px solid #334155;
        margin: 0;
        padding: 1rem;
        max-height: 600px; /* Limit height for very long files */
        overflow: auto;
      }

      #status {
        color: var(--accent);
        margin-bottom: 1rem;
        font-weight: 500;
        min-height: 1.5rem;
      }

    </style>
    <!-- Prism CSS for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  </head>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');

      var Module = {
        print: (function() {
          var element = document.getElementById('output');
          if (element) element.value = ''; // clear browser cache
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            console.log(text);
            if (element) {
              element.value += text + "\n";
              element.scrollTop = element.scrollHeight; // focus on bottom
            }
          };
        })(),
        printErr: function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            console.error(text);
            // Also print to output for visibility
            var element = document.getElementById('output');
             if (element) {
              element.value += "[ERR] " + text + "\n";
              element.scrollTop = element.scrollHeight;
            }
        },
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
          }
          if (statusElement) statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      
      window.onerror = function(event) {
        Module.setStatus('Exception thrown, see JavaScript console');
        Module.setStatus = function(text) {
          if (text) Module.printErr(text);
        };
      };
    </script>
